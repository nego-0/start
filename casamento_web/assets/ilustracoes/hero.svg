<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração de casamento">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E4"/>
      <stop offset="0.55" stop-color="#EFE6D3"/>
      <stop offset="1" stop-color="#E7DBC2"/>
    </linearGradient>
    <g id="sprig" fill="none" stroke="#B4864A" stroke-width="3" stroke-linecap="round">
      <path d="M0 0 C 40 -30 90 -34 140 -20"/>
      <path d="M28 -8 c -6 -20 -2 -34 12 -46" /><path d="M28 -8 c 14 -6 30 -4 44 6"/>
      <path d="M64 -12 c -6 -20 -2 -34 12 -46"/><path d="M64 -12 c 14 -6 30 -4 44 6"/>
      <path d="M100 -16 c -6 -18 -2 -30 10 -42"/><path d="M100 -16 c 14 -6 28 -4 40 6"/>
    </g>
  </defs>
  <rect width="1000" height="1400" fill="url(#bg)"/>
  <!-- Arco botânico -->
  <g transform="translate(500 250)">
    <use href="#sprig" transform="translate(-20 0) scale(1.9)"/>
    <use href="#sprig" transform="translate(20 0) scale(-1.9 1.9)"/>
  </g>
  <!-- Anéis entrelaçados -->
  <g transform="translate(500 560)" fill="none" stroke="#B4864A" stroke-width="6">
    <circle cx="-42" cy="0" r="72"/>
    <circle cx="42" cy="0" r="72" stroke="#8A6031"/>
    <path d="M-6 -66 a72 72 0 0 1 0 132" stroke="#8A6031" stroke-width="6"/>
  </g>
  <!-- Ornamento inferior -->
  <g transform="translate(500 760)" fill="none" stroke="#C79A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M-120 0 H120"/>
    <path d="M0 -14 L14 0 L0 14 L-14 0 Z" fill="#C79A5A" stroke="none"/>
    <path d="M-120 0 c -20 -8 -34 -22 -40 -42"/><path d="M120 0 c 20 -8 34 -22 40 -42"/>
  </g>
  <!-- Folhas soltas -->
  <g fill="#D9BC8C" opacity="0.5">
    <path d="M170 980 q40 -26 80 0 q-40 26 -80 0Z"/>
    <path d="M760 1080 q40 -26 80 0 q-40 26 -80 0Z"/>
    <path d="M240 1180 q34 -22 68 0 q-34 22 -68 0Z"/>
  </g>
</svg>
